# Configuración de nginx para la interfaz de EdRev Cesmag.
# Sirve la interfaz compilada y reenvía /api a la API (el contenedor «api»), así el navegador usa una sola
# dirección y un solo puerto, sin CORS ni direcciones escritas en el código de la interfaz.
server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker resuelve el nombre «api» con su propio DNS; se resuelve en cada petición para que nginx
  # arranque aunque la API todavía no esté lista.
  resolver 127.0.0.11 valid=10s;

  # Las imágenes de las plantillas llegan hasta 2 MB: el límite por defecto de nginx (1 MB) las rechazaría.
  client_max_body_size 5m;

  location /api/ {
    set $api http://api:3000;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Las rutas de la aplicación (React Router) vuelven a index.html.
  location / {
    try_files $uri /index.html;
  }
}
