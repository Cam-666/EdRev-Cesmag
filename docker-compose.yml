# EdRev Cesmag completo: base de datos, API y frontend.
#   docker compose up --build   →   frontend http://localhost:8080 · API http://localhost:3000/api
# La primera vez PostgreSQL ejecuta EdRev b/db/*.sql (esquema y datos iniciales).
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: edrev
      POSTGRES_USER: edrev
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cambie-esta-clave}
    volumes:
      - datos:/var/lib/postgresql
      - ./EdRev b/db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edrev -d edrev"]
      interval: 5s
      retries: 10

  api:
    build: ./EdRev b
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://edrev:${DB_PASSWORD:-cambie-esta-clave}@db:5432/edrev
      JWT_SECRET: ${JWT_SECRET:-cambie-este-secreto}
      CORS_ORIGIN: http://localhost:8080
      CORREO_MODO: ${CORREO_MODO:-simulado}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      ENLACE_DEMO: ${ENLACE_DEMO:-true}
    ports:
      - "3000:3000"

  web:
    build:
      context: ./EdRev f
      args:
        VITE_API_URL: http://localhost:3000/api
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  datos:
